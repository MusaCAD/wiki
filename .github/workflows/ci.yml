name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Starlight's "last updated" reads git history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install poppler (pdftocairo) and the runtime libraries the AppImage leaves to the host
        # The AppImage bundles Qt but not the GL dispatch, EGL/GLX, fontconfig, freetype or
        # harfbuzz libraries (ldd on the bundled binary lists them); a plain runner lacks some.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libfuse2 \
            libglvnd0 libopengl0 libegl1 libglx0 libgl1 \
            libfontconfig1 libfreetype6 libharfbuzz0b libgraphite2-3 \
            libx11-6 libxcb1 libxcb-cursor0 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Cache the pinned engine release
        uses: actions/cache@v4
        with:
          path: .cache/engine
          key: engine-${{ hashFiles('wiki.config.mjs') }}

      - run: npm ci

      - name: Automation does not edit pages people wrote
        if: github.event_name == 'pull_request'
        run: node scripts/check-tiers.mjs --base origin/${{ github.base_ref }} --branch "${{ github.head_ref }}"

      - name: Licence header on every file
        run: npm run check:headers

      - name: Documents kept in the Musa CAD repository, as pages at the pinned release
        run: npm run docs

      - name: Every page has its fields; every command has a page
        run: npm run check:pages

      - name: Generated pages match the data (nobody edited them by hand)
        run: |
          npm run generate
          git diff --exit-code -- src/content/docs/reference || {
            echo "::error::Pages under src/content/docs/reference with tier: generated differ from what scripts/generate-reference.mjs makes. Do not edit them by hand: set tier to assisted or human to write a page."
            exit 1
          }

      - name: Tokens — contrast, both themes
        run: npm run check:contrast

      - name: Pages — staleness and coverage
        run: npm run check:staleness

      - name: Build (renders the examples with the pinned engine first)
        run: npm run build

      - name: Links and anchors
        run: npm run check:links

      - name: Accessibility, keyboard, layout and performance gates
        run: npm run audit

      - name: Layout screenshots (320 / 768 / 1280 / 2560)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: .cache/shots
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
